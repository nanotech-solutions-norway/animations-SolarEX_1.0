<!doctype html>
<html lang="en">
<head>

  <title>Redirecting to SolarEX Intro</title>

</head>
<body>

  <script>

      var base='/animations-SolarEX_1.0/';
      var target=base+'Intro/';

        location.replace(target);

    }());
