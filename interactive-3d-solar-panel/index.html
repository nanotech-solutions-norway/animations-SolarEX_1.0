<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SolarEX Interactive 3D Solar Panel Model</title>
  <meta name="description" content="Interactive SolarEX 3D solar panel model with drag rotation, tilt control, and cinematic playback." />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <main class="viewer-shell" aria-label="SolarEX interactive 3D solar panel model">
    <section class="stage-card">
      <div class="hud top-left">
        <span class="eyebrow">SolarEX technical model</span>
        <h1>Interactive PV Module Assembly</h1>
        <p>Drag to rotate and tilt. Use Play for the cinematic orbit sequence.</p>
      </div>

      <div class="hud top-right" aria-label="Animation status">
        <div class="status-dot" aria-hidden="true"></div>
        <span id="sceneLabel">Animation_scenen_001</span>
      </div>

      <canvas id="solarCanvas" aria-label="Interactive 3D solar panel model"></canvas>

      <div class="control-bar" aria-label="Model controls">
        <button id="playBtn" type="button">Play cinematic rotation</button>
        <button id="resetBtn" type="button">Reset to Animation_scenen_001</button>
        <label class="toggle-row">
          <input id="autoRotate" type="checkbox" />
          <span>Slow technical rotation</span>
        </label>
      </div>
    </section>
  </main>

  <script type="module" src="./src/SolarPanelScene.js"></script>
</body>
</html>
