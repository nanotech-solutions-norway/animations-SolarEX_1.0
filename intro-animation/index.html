<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SolarEX Intro Animation</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020407;font-family:Arial,sans-serif}.stage{position:relative;width:100vw;height:100dvh;min-height:100svh;overflow:hidden;background:#020407;isolation:isolate}.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform-origin:center;will-change:opacity,transform,filter;backface-visibility:hidden}.scene.final{object-fit:contain;background:#020407}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#dff6ff;font-size:14px;letter-spacing:.08em;text-transform:uppercase;z-index:90}.vignette,.grid,.hud,.red,.panelpick,.cells{position:absolute;inset:0;pointer-events:none;opacity:0;will-change:opacity,transform}.vignette{opacity:1;z-index:30;background:radial-gradient(circle at 50% 48%,transparent 42%,rgba(0,0,0,.30) 75%,rgba(0,0,0,.78) 100%)}.grid{z-index:16;background-image:linear-gradient(rgba(120,190,220,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(120,190,220,.16) 1px,transparent 1px);background-size:48px 48px;transform:perspective(900px) rotateX(60deg) translateY(18%);transform-origin:50% 100%;mix-blend-mode:screen}.hud{z-index:20}.hud:before{content:"";position:absolute;inset:3%;border:1px solid rgba(220,242,255,.32)}.red{z-index:24}.red:before{content:"";position:absolute;left:72%;top:53%;width:min(8vw,112px);height:min(5.4vw,78px);transform:translate(-50%,-50%) rotate(-6deg);border:2px solid rgba(255,35,35,.95);border-radius:8px;background:rgba(255,0,0,.10);box-shadow:0 0 18px red,0 0 44px rgba(255,35,35,.32),inset 0 0 24px rgba(255,35,35,.20)}.panelpick{z-index:25}.panelpick:before{content:"";position:absolute;left:50%;top:56%;width:min(18vw,260px);height:min(7vw,100px);transform:translate(-50%,-50%) rotate(-8deg);border:2px solid rgba(255,35,35,.95);border-radius:8px;box-shadow:0 0 22px red,0 0 55px rgba(255,35,35,.35)}.cells{z-index:26;display:grid;place-items:center}.cells div{width:min(20vw,255px);height:min(10.2vw,130px);display:grid;grid-template-columns:1fr 1fr;gap:7px;transform:translate(-7%,-2%)}.cells i{display:block;border-radius:6px;border:1px solid #ff5f5f;background:rgba(255,0,0,.30);box-shadow:0 0 16px red,0 0 36px rgba(255,35,35,.35),inset 0 0 18px rgba(255,120,120,.18)}@media(max-width:680px){.grid{background-size:34px 34px}.red:before{width:15vw;height:10vw}.panelpick:before{width:34vw;height:13vw}.cells div{width:40vw;height:21vw}}</style></head><body><main class="stage" aria-label="SolarEX transition-only image-layer animation"><div class="loading">Loading SolarEX sequence</div></main><script>const files=["000","001","002","003","004","005","006","007"];const stage=document.querySelector(".stage");const loading=document.querySelector(".loading");const seg=[["pan",0,.65],["t",0,1,.65],["t",1,2,.55],["t",2,3,.45],["t",3,4,.55],["t",4,5,.55],["t",5,6,.60],["t",6,7,.90],["hold",7,.45]],T=5;function C(x,a=0,b=1){return Math.min(b,Math.max(a,x))}function E(x){x=C(x);return x*x*(3-2*x)}function M(a,b,t){return a+(b-a)*t}function st(el,o,s,x,y,b=1,sa=1,co=1){el.style.opacity=o;el.style.transform=`translate3d(${x}%,${y}%,0) scale(${s})`;el.style.filter=`brightness(${b}) saturate(${sa}) contrast(${co})`}async function boot(){const srcs=await Promise.all(files.map(async n=>{const r=await fetch(`assets/${n}.webp.b64`,{cache:"force-cache"});if(!r.ok)throw new Error(`Missing scene asset ${n}`);const b64=(await r.text()).trim();return `data:image/webp;base64,${b64}`}));const ims=srcs.map((src,i)=>{const im=new Image();im.className="scene"+(i===7?" final":"");im.alt="";im.decoding="async";im.src=src;stage.appendChild(im);return im});stage.insertAdjacentHTML("beforeend",'<div class="grid"></div><div class="hud"></div><div class="red"></div><div class="panelpick"></div><div class="cells"><div><i></i><i></i><i></i><i></i></div></div><div class="vignette"></div>');const grid=document.querySelector(".grid"),hud=document.querySelector(".hud"),red=document.querySelector(".red"),pick=document.querySelector(".panelpick"),cells=document.querySelector(".cells");loading.remove();function draw(ms){let t=(ms/1000)%T,acc=0,cur=seg[0],q=0;for(const z of seg){const d=z[z.length-1];if(t>=acc&&t<acc+d){cur=z;q=(t-acc)/d;break}acc+=d}q=E(q);ims.forEach(im=>st(im,0,1,0,0));grid.style.opacity=hud.style.opacity=red.style.opacity=pick.style.opacity=cells.style.opacity=0;if(cur[0]==="pan"){st(ims[0],1,M(1.08,1.14,q),M(-2,2,q),M(-1,-2,q))}else if(cur[0]==="hold"){st(ims[7],1,1.02,0,0);cells.style.opacity=.82+.18*Math.sin(ms*.006);grid.style.opacity=hud.style.opacity=.55}else{const a=cur[1],b=cur[2];let A={s:1,x:0,y:0,br:1,sa:1,co:1},B={s:1,x:0,y:0,br:1,sa:1,co:1};if(a===0){A={s:M(1.14,1.28,q),x:M(2,0,q),y:M(-2,-5,q),br:1,sa:1,co:1};B={s:M(1.16,1.02,q),x:0,y:M(4,0,q),br:1,sa:1,co:1}}if(a===1){A={s:M(1.02,1.05,q),x:0,y:0,br:M(1,.48,q),sa:M(1,.45,q),co:M(1,1.08,q)};B={s:M(1.05,1.07,q),x:0,y:M(1,0,q),br:M(.72,1,q),sa:M(.6,1,q),co:M(1,1.15,q)};grid.style.opacity=hud.style.opacity=q*.75;red.style.opacity=q}if(a===2){A={s:M(1.07,1.09,q),x:0,y:0,br:1,sa:1,co:M(1,1.12,q)};B={s:M(1.09,1.1,q),x:M(0,-.5,q),y:M(0,-.5,q),br:1,sa:1,co:M(1.05,1.18,q)};grid.style.opacity=hud.style.opacity=.78;red.style.opacity=1}if(a===3){A={s:M(1.1,1.12,q),x:0,y:0,br:M(.85,.7,q),sa:M(.8,.55,q),co:1.15};B={s:M(1.1,1.06,q),x:0,y:0,br:M(.78,1,q),sa:M(.65,1,q),co:M(1.15,1.05,q)};grid.style.opacity=hud.style.opacity=M(.78,.35,q);red.style.opacity=1}if(a===4){A={s:M(1.06,1.03,q),x:0,y:0,br:1,sa:1,co:1.04};B={s:M(1.03,1,q),x:0,y:0,br:1,sa:1,co:1};grid.style.opacity=hud.style.opacity=(1-q)*.35;red.style.opacity=1-q}if(a===5){A={s:M(1,.92,q),x:0,y:M(0,4,q),br:1,sa:1,co:1};B={s:M(1.16,1.03,q),x:M(-1,0,q),y:M(-2,0,q),br:1,sa:1,co:1}}if(a===6){A={s:M(1.03,1.3,q),x:M(0,1,q),y:M(0,-5,q),br:M(1,.45,q),sa:M(1,.35,q),co:M(1,1.15,q)};B={s:M(1.22,1.02,q),x:0,y:M(2,0,q),br:M(.72,1,q),sa:M(.55,1,q),co:M(1.05,1.12,q)};grid.style.opacity=hud.style.opacity=q*.85;pick.style.opacity=q<.62?q/.62:(1-q)/.38;cells.style.opacity=C((q-.55)/.45)}st(ims[a],1-q,A.s,A.x,A.y,A.br,A.sa,A.co);st(ims[b],q,B.s,B.x,B.y,B.br,B.sa,B.co)}requestAnimationFrame(draw)}requestAnimationFrame(draw)}boot().catch(err=>{loading.textContent=err.message});</script></body></html>
