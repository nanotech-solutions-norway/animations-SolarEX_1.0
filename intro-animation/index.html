<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SolarEX Intro Animation</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#020407}body{font-family:Arial}.stage{position:relative;width:100vw;height:100vh;background:#020407;overflow:hidden}.s{position:absolute;inset:-8%;opacity:0;animation:show 39s infinite linear}.sky{position:absolute;inset:0;background:linear-gradient(#b7ddf6 0 30%,#68a13f 30%)}.farm{position:absolute;inset:25% -10% -15%;display:grid;grid-template-columns:repeat(14,1fr);gap:14px;transform:perspective(800px) rotateX(58deg) rotateZ(-7deg)}.p{height:50px;background:#082a55;border:2px solid #dcecff;box-shadow:0 8px 12px #0008}.panel{position:absolute;left:50%;top:53%;width:min(74vw,980px);height:min(38vw,500px);transform:translate(-50%,-50%) rotate(-2deg);background:#061a35;border:7px solid #dcecff;box-shadow:0 30px 70px #000c}.panel:before{content:"";position:absolute;inset:4%;background:repeating-linear-gradient(90deg,transparent 0 15%,#ffffff66 15.8% 16.7%,transparent 17% 33%),repeating-linear-gradient(0deg,transparent 0 15%,#ffffff55 15.8% 16.7%,transparent 17% 33%)}.panel:after{content:"";position:absolute;left:48%;top:103%;width:10%;height:30%;background:#9ba4aa;box-shadow:0 72px 0 38px #6d767c}.ground{position:absolute;inset:30% 0 0;background:#17270d}.tech{background:#020407}.tech .panel{filter:grayscale(1) brightness(.55);box-shadow:0 0 45px #dcecff55}.hybrid{background:linear-gradient(#b7ddf6 0 30%,#15240d 30%)}.final .panel{top:48%;width:min(78vw,900px);height:min(42vw,480px);background:#04070b}.grid,.hud,.target,.vignette{position:absolute;inset:0;pointer-events:none}.grid{opacity:0;animation:grid 39s infinite;background-image:linear-gradient(#7bdcff33 1px,transparent 1px),linear-gradient(90deg,#7bdcff33 1px,transparent 1px);background-size:54px 54px;transform:perspective(800px) rotateX(59deg) translateY(20%);transform-origin:50% 100%}.hud{opacity:0;animation:grid 39s infinite}.hud:before{content:"";position:absolute;inset:3%;border:1px solid #dcecff55}.target{opacity:0;animation:target 39s infinite}.select{position:absolute;left:56%;top:54%;width:min(23vw,300px);height:min(9vw,112px);border:2px solid #ff2a2a;border-radius:8px;box-shadow:0 0 22px #ff2525,0 0 52px #ff252555;transform:translate(-50%,-50%) rotate(-8deg)}.cells{position:absolute;left:50%;top:48%;width:min(21vw,260px);height:min(11vw,140px);display:grid;grid-template-columns:1fr 1fr;gap:7px;transform:translate(-50%,-50%);opacity:0;animation:cells 39s infinite}.cells i{background:#e71919;border:1px solid #ff7777;border-radius:6px;box-shadow:0 0 18px #ff2424}.vignette{background:radial-gradient(circle,transparent 40%,#0008 80%,#000 100%)}@keyframes show{0%,100%{opacity:0}5%,12%{opacity:1}}@keyframes grid{0%,25%,66%,100%{opacity:0}28%,58%,78%,92%{opacity:.75}}@keyframes target{0%,27%,59%,70%,100%{opacity:0}31%,56%,75%,96%{opacity:1}}@keyframes cells{0%,80%{opacity:0}87%,100%{opacity:1}}#s0{animation-delay:0s}#s1{animation-delay:-4.8s}#s2{animation-delay:-9.8s}#s3{animation-delay:-13.4s}#s4{animation-delay:-17.2s}#s5{animation-delay:-21.2s}#s6{animation-delay:-26s}#s7{animation-delay:-32s}@media(max-width:680px){.p{height:38px}.panel{width:92vw;height:50vw}.cells{width:38vw;height:20vw}.select{width:40vw;height:16vw}}</style></head><body><main class="stage"><div id="s0" class="s"><div class="sky"></div><div class="farm"></div></div><div id="s1" class="s"><div class="sky"></div><div class="ground"></div><div class="panel"></div></div><div id="s2" class="s tech"><div class="panel"></div></div><div id="s3" class="s tech"><div class="panel"></div></div><div id="s4" class="s hybrid"><div class="panel"></div></div><div id="s5" class="s"><div class="sky"></div><div class="ground"></div><div class="panel"></div></div><div id="s6" class="s"><div class="sky"></div><div class="farm"></div></div><div id="s7" class="s final tech"><div class="panel"></div></div><div class="grid"></div><div class="hud"></div><div class="target"><div class="select"></div></div><div class="cells"><i></i><i></i><i></i><i></i></div><div class="vignette"></div></main><script>document.querySelectorAll('.farm').forEach(f=>{for(let i=0;i<126;i++){let p=document.createElement('i');p.className='p';f.appendChild(p)}})</script></body></html>
